services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: paper_archive
      POSTGRES_USER: paper_archive
      POSTGRES_PASSWORD: paper_archive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_archive -d paper_archive"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://paper_archive:paper_archive@db:5432/paper_archive
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-change-me}
      SHARED_PASSWORD: ${SHARED_PASSWORD:-papers}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: ${SLACK_OAUTH_REDIRECT_URI:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      SLACK_OAUTH_MIGRATION_MODE: ${SLACK_OAUTH_MIGRATION_MODE:-false}
      SLACK_LEGACY_TEAM_ID: ${SLACK_LEGACY_TEAM_ID:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      ARXIV_REQUEST_DELAY_SECONDS: ${ARXIV_REQUEST_DELAY_SECONDS:-3}
      ZOTERO_API_BASE_URL: ${ZOTERO_API_BASE_URL:-https://api.zotero.org}
      ZOTERO_SYNC_LIMIT: ${ZOTERO_SYNC_LIMIT:-20}
      RELATED_PAPERS_ENABLED: ${RELATED_PAPERS_ENABLED:-false}
      RELATED_PAPERS_LIMIT: ${RELATED_PAPERS_LIMIT:-5}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://paper_archive:paper_archive@db:5432/paper_archive
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-change-me}
      SHARED_PASSWORD: ${SHARED_PASSWORD:-papers}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      SLACK_OAUTH_MIGRATION_MODE: ${SLACK_OAUTH_MIGRATION_MODE:-false}
      SLACK_LEGACY_TEAM_ID: ${SLACK_LEGACY_TEAM_ID:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
      BACKFILL_LIMIT_PER_CHANNEL: ${BACKFILL_LIMIT_PER_CHANNEL:-200}
      ARXIV_REQUEST_DELAY_SECONDS: ${ARXIV_REQUEST_DELAY_SECONDS:-3}
      ZOTERO_SYNC_LIMIT: ${ZOTERO_SYNC_LIMIT:-20}
      RELATED_PAPERS_ENABLED: ${RELATED_PAPERS_ENABLED:-false}
      RELATED_PAPERS_LIMIT: ${RELATED_PAPERS_LIMIT:-5}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
