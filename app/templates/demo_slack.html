{% extends "base.html" %}
{% block title %}Demo Slack{% endblock %}
{% block content %}
<section class="status-header">
  <div>
    <p class="eyebrow">Local simulator</p>
    <h1>Post a paper link as if it came from Slack.</h1>
  </div>
</section>

<form class="slack-composer" method="post" action="/demo/slack">
  <div class="filters compact">
    <label>
      Channel
      <select name="channel_id">
        {% for channel in channels %}
        <option value="{{ channel.id }}">#{{ channel.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Sender
      <select name="user_id">
        {% for user in users %}
        <option value="{{ user.id }}">{{ user.name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>
    Message
    <textarea name="text" rows="6" placeholder="Paste an arXiv link here"></textarea>
  </label>
  <button type="submit">Post message</button>
</form>
{% endblock %}
